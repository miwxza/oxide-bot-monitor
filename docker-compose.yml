services:
  # จาก candidate pack (เหมือนเดิม) — `docker compose up -d postgres` ยังใช้ได้ตาม README ของ pack
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oxide_monitor
      POSTGRES_USER: oxide
      POSTGRES_PASSWORD: oxide_dev
    ports:
      - "55432:5432"
    volumes:
      - oxide_candidate_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oxide -d oxide_monitor"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Bot Simulator จาก candidate pack (ไม่ได้แก้ไฟล์)
  simulator:
    build: .
    command: ["node", "simulator/server.js"]
    ports:
      - "8788:8788"

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://oxide:oxide_dev@postgres:5432/oxide_monitor
      BOT_SIMULATOR_URL: http://simulator:8788
      PORT: 3000
      ADMIN_TOKEN: dev-admin-token
      AGENT_TOKEN: dev-agent-token
      WEBHOOK_SECRET: dev-webhook-secret
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      simulator:
        condition: service_started

  # bot agent 3 เครื่อง (bot-01..03) — process แยกกัน ปิดทีละเครื่องได้ด้วย docker compose exec / restart
  agents:
    build: .
    command: ["node", "dist/agent/fleet.js", "bot-01", "bot-02", "bot-03"]
    environment:
      SERVER_URL: http://api:3000
      AGENT_TOKEN: dev-agent-token
    volumes:
      # แพ็กเกจที่ติดตั้งแล้วอยู่บน "ดิสก์ของเครื่อง" — ไม่หายตอน rebuild/recreate container
      - agent_data:/app/.agent-data
    depends_on:
      - api

  # รันเทสต์ทั้งหมด (unit + integration บน Postgres จริง): docker compose run --rm --build test
  test:
    build:
      context: .
      target: dev
    command: ["npx", "jest", "--runInBand"]
    environment:
      TEST_DATABASE_URL: postgresql://oxide:oxide_dev@postgres:5432/oxide_test
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["test"]

volumes:
  oxide_candidate_pg:
  agent_data:
